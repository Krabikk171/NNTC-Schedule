name: Android checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Android 37 SDK platform
        run: |
          # ubuntu-latest already provides the Android command-line tools.
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-37'
      - name: Build and run JVM tests (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
